<section id="home-content">
  <h2>Projects</h2>
  <div class="project-grid">
    {{#projects}}
    <a class="project-card" href="{{link}}">
      <img src="{{imageUrl}}" alt="" />
      <span class="project-name">{{name}}</span>
      <span class="project-description">{{description}}</span>
    </a>
    {{/projects}}
  </div>
</section>
