<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Justin Liang</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <nav class="sidebar">
      <h1><a href="#justin" data-src="/justin">justin liang</a></h1>
      <a href="#about" data-src="/about">about</a>
      <h2>are.na channels</h2>
      <a
        href="#slowness"
        data-src="https://www.are.na/justin-liang/slowness-in-the-creative-process/embed"
        >slowness</a
      >
      <a
        href="#justin-liang"
        data-src="https://www.are.na/justin-liang/justin-liang-969c3qmu7bg/embed"
        >justin liang</a
      >
      <a
        href="#uncategorized"
        data-src="https://www.are.na/justin-liang/uncategorized-x90eek6ekqu/embed"
        >uncategorized</a
      >
    </nav>

    <main>
      <iframe src="/about"></iframe>
    </main>

    <script>
      const DEFAULT_PATH = "#about";

      const links = document.querySelectorAll(".sidebar a");
      const iframe = document.querySelector("main iframe");

      function activate(hash) {
        const target =
          document.querySelector(`.sidebar a[href="${hash}"]`) || links[0];
        links.forEach((l) => l.classList.remove("active"));
        target.classList.add("active");
        iframe.src = target.dataset.src;
      }

      window.addEventListener("hashchange", () => activate(location.hash));
      activate(location.hash || "#about");
    </script>
  </body>
</html>
