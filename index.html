<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Justin Liang</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <nav class="sidebar">
      <h1>justin liang</h1>
      <a
        href="#"
        class="active"
        data-src="https://www.are.na/justin-liang/slowness-in-the-creative-process/embed"
        >slowness</a
      >
      <a
        href="#"
        data-src="https://www.are.na/justin-liang/justin-liang-969c3qmu7bg/embed"
        >justin liang</a
      >
      <a
        href="#"
        data-src="https://www.are.na/justin-liang/uncategorized-x90eek6ekqu/embed"
        >uncategorized</a
      >
    </nav>

    <main>
      <iframe
        src="https://www.are.na/justin-liang/slowness-in-the-creative-process/embed"
      ></iframe>
    </main>

    <script>
      const links = document.querySelectorAll(".sidebar a");
      const iframe = document.querySelector("main iframe");

      links.forEach((link) => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          links.forEach((l) => l.classList.remove("active"));
          link.classList.add("active");
          iframe.src = link.dataset.src;
        });
      });
    </script>
  </body>
</html>
